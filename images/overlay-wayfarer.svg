<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <defs>
    <linearGradient id="wf-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--frame-c1, #2b2b2b)"/>
      <stop offset="50%" stop-color="var(--frame-c2, #181818)"/>
      <stop offset="100%" stop-color="var(--frame-c3, #0a0a0a)"/>
    </linearGradient>
    <linearGradient id="wf-lens-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--lens-tint, #ffffff)" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="var(--lens-tint, #ffffff)" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="var(--lens-glare, #38bdf8)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="var(--lens-tint, #ffffff)" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="wf-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#wf-shadow)">
    <!-- Left Glass -->
    <path d="M48,60 C90,56 220,62 258,74 C255,130 240,185 195,200 C155,212 75,200 55,160 C42,125 45,85 48,60 Z" fill="url(#wf-lens-glare)"/>
    <!-- Right Glass -->
    <path d="M592,60 C550,56 420,62 382,74 C385,130 400,185 445,200 C485,212 565,200 585,160 C598,125 595,85 592,60 Z" fill="url(#wf-lens-glare)"/>

    <!-- Left Thick Acetate Wayfarer Rim -->
    <path d="M48,60 C90,56 220,62 258,74 C255,130 240,185 195,200 C155,212 75,200 55,160 C42,125 45,85 48,60 Z" stroke="url(#wf-frame-grad)" stroke-width="14" stroke-linejoin="round" fill="none"/>
    <path d="M54,66 C92,62 216,68 250,78 C248,128 234,178 193,192 C157,203 82,192 63,156 C51,126 53,89 54,66 Z" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none"/>

    <!-- Right Thick Acetate Wayfarer Rim -->
    <path d="M592,60 C550,56 420,62 382,74 C385,130 400,185 445,200 C485,212 565,200 585,160 C598,125 595,85 592,60 Z" stroke="url(#wf-frame-grad)" stroke-width="14" stroke-linejoin="round" fill="none"/>
    <path d="M586,66 C548,62 424,68 390,78 C392,128 406,178 447,192 C483,203 558,192 577,156 C589,126 587,89 586,66 Z" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none"/>

    <!-- Bold Bridge -->
    <path d="M255,80 C275,68 365,68 385,80" stroke="url(#wf-frame-grad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M258,78 C275,69 365,69 382,78" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>

    <!-- Silver Rivets (Wayfarer Signature Accents) -->
    <ellipse cx="32" cy="62" rx="4.5" ry="2.5" transform="rotate(-15 32 62)" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
    <ellipse cx="608" cy="62" rx="4.5" ry="2.5" transform="rotate(15 608 62)" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>

    <!-- Outer Temples -->
    <path d="M42,66 L12,70" stroke="url(#wf-frame-grad)" stroke-width="13" stroke-linecap="round"/>
    <path d="M598,66 L628,70" stroke="url(#wf-frame-grad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Glass Glare -->
    <line x1="80" y1="75" x2="160" y2="185" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.12"/>
    <line x1="420" y1="75" x2="500" y2="185" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.12"/>
  </g>
</svg>