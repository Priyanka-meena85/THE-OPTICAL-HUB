<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
  <defs>
    <linearGradient id="ce-frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--frame-c1, #2b2b2b)"/>
      <stop offset="50%" stop-color="var(--frame-c2, #181818)"/>
      <stop offset="100%" stop-color="var(--frame-c3, #0a0a0a)"/>
    </linearGradient>
    <linearGradient id="ce-lens-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--lens-tint, #ffffff)" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="var(--lens-tint, #ffffff)" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="var(--lens-glare, #38bdf8)" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="var(--lens-tint, #ffffff)" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="ce-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#ce-shadow)">
    <!-- Left Glass -->
    <path d="M25,55 C120,68 215,80 256,92 C252,145 230,195 180,205 C130,215 55,190 42,145 C35,115 28,75 25,55 Z" fill="url(#ce-lens-glare)"/>
    <!-- Right Glass -->
    <path d="M615,55 C520,68 425,80 384,92 C388,145 410,195 460,205 C510,215 585,190 598,145 C605,115 612,75 615,55 Z" fill="url(#ce-lens-glare)"/>

    <!-- Left Upswept Cat-Eye Rim -->
    <path d="M25,55 C120,68 215,80 256,92 C252,145 230,195 180,205 C130,215 55,190 42,145 C35,115 28,75 25,55 Z" stroke="url(#ce-frame-grad)" stroke-width="11" stroke-linejoin="round" fill="none"/>
    <path d="M30,62 C122,74 212,85 248,96 C245,142 225,188 178,197 C133,206 63,184 50,143 C44,115 35,78 30,62 Z" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none"/>

    <!-- Right Upswept Cat-Eye Rim -->
    <path d="M615,55 C520,68 425,80 384,92 C388,145 410,195 460,205 C510,215 585,190 598,145 C605,115 612,75 615,55 Z" stroke="url(#ce-frame-grad)" stroke-width="11" stroke-linejoin="round" fill="none"/>
    <path d="M610,62 C518,74 428,85 392,96 C395,142 415,188 462,197 C507,206 577,184 590,143 C596,115 605,78 610,62 Z" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" fill="none"/>

    <!-- Feminine Bridge -->
    <path d="M254,95 C275,80 365,80 386,95" stroke="url(#ce-frame-grad)" stroke-width="10" stroke-linecap="round"/>
    <path d="M256,93 C275,81 365,81 384,93" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>

    <!-- Cat-Eye Wing Highlights -->
    <circle cx="20" cy="52" r="3" fill="#e2e8f0"/>
    <circle cx="620" cy="52" r="3" fill="#e2e8f0"/>

    <!-- Glare Sheen -->
    <line x1="70" y1="75" x2="150" y2="185" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.12"/>
    <line x1="430" y1="75" x2="510" y2="185" stroke="#ffffff" stroke-width="20" stroke-linecap="round" opacity="0.12"/>
  </g>
</svg>